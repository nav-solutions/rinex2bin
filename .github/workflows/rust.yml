name: CI

on:
  push:
    branches: [ "main" ]
    tags:
      - "*"
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Linter
      run: cargo fmt --all -- --check
  
    - name: Build (Default)
      run: cargo build

    - name: Build (All features)
      run: cargo build --all-features

    - name: Build (BINEX)
      run: |
        cargo build --no-default-features --features binex
    
    - name: Build (GPS)
      run: |
        cargo build --no-default-features --features gps
    
    - name: Build (QZSS)
      run: |
        cargo build --no-default-features --features qzss
    
    - name: Build (RTCM)
      run: |
        cargo build --no-default-features --features rtcm
    
    - name: Build (UBX)
      run: |
        cargo build --no-default-features --features ubx

  windows-build:
    name: Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3

    - uses: actions-rs/toolchain@v1
      name: Install Rust
      with:
        toolchain: stable
        override: true
        
    - uses: actions-rs/cargo@v1
      name: Build (default) 
      with:
        command: build
        args: --release

    - uses: actions-rs/cargo@v1
      name: Build (all features)
      with: 
        command: build 
        args: --all-features --release
  
  macos-build:
    name: MacOS
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions-rs/toolchain@v1
      name: Install Rust
      with:
        toolchain: stable
        override: true
    
    - uses: actions-rs/cargo@v1
      name: Build (default) 
      with:
        command: build
        args: --release

    - uses: actions-rs/cargo@v1
      name: Build (all features)
      with: 
        command: build 
        args: --all-features --release
